services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: financial-kafka

    ports:
      - "9092:9092"

    environment:

      # Identification du nœud Kafka
      KAFKA_NODE_ID: 1

      # Ce serveur joue les deux rôles en développement :
      # broker + controller
      KAFKA_PROCESS_ROLES: broker,controller

      # Controller KRaft
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Les ports d'écoute
      KAFKA_LISTENERS: CONTROLLER://:9093,EXTERNAL://:9092,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER


      # Comme nous avons un seul broker en développement
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Démarrage immédiat pour le développement
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka-data:/var/lib/kafka/data

  spark:
    image: apache/spark:4.0.1
    container_name: financial-spark
    command: /opt/spark/bin/spark-shell
    depends_on:
      - kafka
    ports:
      - "4040:4040"
      - "8081:8080"
    volumes:
      - ./spark:/opt/spark-apps
      - ./spark-data:/opt/spark-data
      - ./ivy-cache:/opt/ivy-cache

volumes:
  kafka-data: